<!DOCTYPE html>
<html>
<head>
  <title>Chatrooms</title>
  <style>
    body { font-family: Arial; background:#111; color:white; }
    .room { padding:10px; background:#222; margin:10px; border-radius:8px; cursor:pointer; }
    img { width:40px; height:40px; border-radius:50%; }
  </style>
</head>
<body>

<h2>Create Room</h2>
<input id="roomName" placeholder="Room name">
<input id="roomIcon" type="file">
<button onclick="createRoom()">Create</button>

<h2>Rooms</h2>
<div id="rooms"></div>

<script>
async function createRoom() {
  const name = document.getElementById("roomName").value;
  const iconFile = document.getElementById("roomIcon").files[0];

  const iconBase64 = await fileToBase64(iconFile);

  await fetch("/api/createRoom", {
    method: "POST",
    body: JSON.stringify({ name, icon: iconBase64 }),
  });

  loadRooms();
}

async function loadRooms() {
  const res = await fetch("/api/getRooms");
  const rooms = await res.json();

  const container = document.getElementById("rooms");
  container.innerHTML = "";

  rooms.forEach(r => {
    container.innerHTML += `
      <div class="room" onclick="enterRoom('${r.id}')">
        <img src="${r.icon}">
        <b>${r.name}</b>
      </div>
    `;
  });
}

function enterRoom(id) {
  window.location = "/room.html?room=" + id;
}

function fileToBase64(file) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(file);
  });
}

loadRooms();
</script>

</body>
</html>
