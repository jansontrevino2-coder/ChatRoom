<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Chatroom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 420px;
      background: #1b1b1b;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 16px;
      background: #272727;
      border-bottom: 1px solid #333;
      font-weight: bold;
      font-size: 16px;
    }

    .setup {
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setup input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #151515;
      color: #eee;
    }

    .setup button {
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #4a8cff;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .setup button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .chat {
      flex: 1;
      padding: 10px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #141414;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .message img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #555;
    }

    .message-content {
      background: #222;
      padding: 6px 8px;
      border-radius: 6px;
      max-width: 80%;
    }

    .message-username {
      font-size: 12px;
      font-weight: bold;
      color: #9ec3ff;
      margin-bottom: 2px;
    }

    .message-text {
      font-size: 13px;
      color: #eee;
      word-wrap: break-word;
    }

    .input-area {
      display: flex;
      padding: 10px 12px;
      border-top: 1px solid #333;
      background: #181818;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #151515;
      color: #eee;
    }

    .input-area button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #4a8cff;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .status {
      font-size: 11px;
      color: #aaa;
      padding: 4px 12px 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Chatroom</div>

    <!-- User setup -->
    <div class="setup">
      <input id="usernameInput" type="text" placeholder="Enter username">
      <input id="pfpInput" type="text" placeholder="Enter PFP image URL (optional)">
      <button id="joinBtn">Join Chat</button>
      <span class="status" id="statusText">Set your username and PFP to start chatting.</span>
    </div>

    <!-- Chat messages -->
    <div class="chat" id="chatBox"></div>

    <!-- Message input -->
    <div class="input-area">
      <input id="messageInput" type="text" placeholder="Type a message..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById('usernameInput');
    const pfpInput = document.getElementById('pfpInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusText = document.getElementById('statusText');

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let currentUser = null;

    // Default avatar if none or invalid
    const defaultAvatar = 'https://via.placeholder.com/64/444444/FFFFFF?text=User';

    joinBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      let pfpUrl = pfpInput.value.trim();

      if (!username) {
        statusText.textContent = 'Username is required.';
        return;
      }

      if (!pfpUrl) {
        pfpUrl = defaultAvatar;
      }

      currentUser = {
        username,
        pfpUrl
      };

      statusText.textContent = `You are logged in as "${username}".`;
      messageInput.disabled = false;
      sendBtn.disabled = false;
      usernameInput.disabled = true;
      pfpInput.disabled = true;
      joinBtn.disabled = true;
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      addMessage(currentUser.username, currentUser.pfpUrl, text);
      messageInput.value = '';
    }

    function addMessage(username, pfpUrl, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      const img = document.createElement('img');
      img.src = pfpUrl || defaultAvatar;
      img.onerror = () => {
        img.src = defaultAvatar;
      };

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      const userSpan = document.createElement('div');
      userSpan.className = 'message-username';
      userSpan.textContent = username;

      const textSpan = document.createElement('div');
      textSpan.className = 'message-text';
      textSpan.textContent = text;

      contentDiv.appendChild(userSpan);
      contentDiv.appendChild(textSpan);

      msgDiv.appendChild(img);
      msgDiv.appendChild(contentDiv);

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Demo: system message
    addMessage('System', defaultAvatar, 'Welcome to the chatroom! Set your username and PFP to start.');
  </script>
</body>
</html>
