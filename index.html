<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chatroom</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

<style>
  body { background:#111; color:#eee; font-family:Arial; margin:0; }
  #chat { height:80vh; overflow-y:auto; padding:10px; }
  .msg { display:flex; gap:10px; margin-bottom:10px; }
  .msg img { width:40px; height:40px; border-radius:50%; }
  .bubble { background:#222; padding:8px 12px; border-radius:8px; }
  #inputArea { display:flex; padding:10px; gap:10px; }
  #inputArea input { flex:1; padding:8px; }
</style>
</head>
<body>

<div id="setup">
  <h2>Enter Username & PFP</h2>
  <input id="username" placeholder="Username"><br><br>
  <input id="pfp" placeholder="PFP Image URL"><br><br>
  <button onclick="joinChat()">Join</button>
</div>

<div id="chat" style="display:none;"></div>

<div id="inputArea" style="display:none;">
  <input id="msgInput" placeholder="Type a message...">
  <button onclick="sendMsg()">Send</button>
</div>

<script>
/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ---------------- CHAT LOGIC ---------------- */
let user = {};

function joinChat() {
  user.username = document.getElementById("username").value.trim();
  user.pfp = document.getElementById("pfp").value.trim() || 
             "https://via.placeholder.com/40";

  if (!user.username) return alert("Username required");

  document.getElementById("setup").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("inputArea").style.display = "flex";

  db.ref("messages").on("child_added", snapshot => {
    const data = snapshot.val();
    addMessage(data.username, data.pfp, data.text);
  });
}

function sendMsg() {
  const text = document.getElementById("msgInput").value.trim();
  if (!text) return;

  db.ref("messages").push({
    username: user.username,
    pfp: user.pfp,
    text
  });

  document.getElementById("msgInput").value = "";
}

function addMessage(username, pfp, text) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "msg";

  div.innerHTML = `
    <img src="${pfp}">
    <div class="bubble">
      <strong>${username}</strong><br>
      ${text}
    </div>
  `;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
